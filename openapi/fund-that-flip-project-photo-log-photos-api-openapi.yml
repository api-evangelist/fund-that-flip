components:
  responses:
    ValidationException:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Errors overview.
              errors:
                type: object
                description: A detailed description of each field that failed validation.
                additionalProperties:
                  type: array
                  items:
                    type: string
            required:
            - message
            - errors
    AuthenticationException:
      description: Unauthenticated
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Error overview.
            required:
            - message
  schemas:
    File:
      type: object
      properties:
        uuid:
          type: string
          description: Public identifier
        name:
          type: string
          description: 'Short human-readable description to distinguish this file from

            other files across the entire Project'
        size:
          type: integer
          description: File size in bytes
        type:
          type: string
          description: 'Roughly what kind of file is available. Such as `pdf` or `jpeg`.

            Note that this is not a file MIME-type, but can be used by

            clients to change how they handle the file.'
        source_url:
          type: object
          description: URLs to full versions of the file
          properties:
            view:
              type: string
              description: URL to view the file on the device, as an inline HTTP response
            download:
              type: string
              description: URL to download the file, as a download HTTP response
          required:
          - view
          - download
        preview_url:
          type: object
          description: 'URLs to view smaller versions of the file''s contents. Images

            will return a smaller version of the image itself. Documents

            will return a placeholder document image and not the file''s

            actual contents.'
          properties:
            thumbnail:
              type: string
              description: Up to approximately 300px wide
            large:
              type: string
              description: Up to approximately 600px wide
          required:
          - thumbnail
          - large
      required:
      - uuid
      - name
      - size
      - type
      - source_url
      - preview_url
      title: File
    V1PhotoLogUpdateRequest:
      type: object
      properties:
        photo_date:
          type: string
          format: date
          description: 'Optional. Date this Photo was captured. Photos with the same

            Date display ordered next to each other in the Photo Log.'
        photo_description:
          type:
          - string
          - 'null'
          description: 'Optional. Text displayed alongside the photo. Useful for

            communicating more context about what is in the photo.'
      title: V1PhotoLogUpdateRequest
    Project_Photo_Log:
      type: object
      properties:
        photos_by_date:
          type: array
          items:
            $ref: '#/components/schemas/Project_Photo_Log__Date_Group'
      required:
      - photos_by_date
      title: Project Photo Log
    Project_Photo_Log__Date_Group:
      type: object
      properties:
        group_date:
          type: string
          description: Photos should display in a group titled by this date. In format `YYYY-MM-DD`
        photos:
          type: array
          description: Photos grouped by this date
          items:
            $ref: '#/components/schemas/Project_Photo_Log__Photo'
      required:
      - group_date
      - photos
      title: 'Project Photo Log: Date Group'
    Project_Photo_Log__Photo:
      type: object
      properties:
        uuid:
          type: string
          description: Public Identifier
        order:
          type: integer
          description: 'Sequence position of this Photo relative to other Photos with

            the same Photo Date. Smaller numbers will display before larger

            numbers. Often this is the Unix timestamp of when the Photo was

            captured. But if the photos have been manually re-ordered, the

            order will begin from 0 and increment by 1. If two photos have

            the same order, photos created more recently will display first.'
        created_at:
          type: string
          description: 'Timestamp when Photo was added to Photo Log in ISO 8601 Zulu

            format with microseconds. Example: `2025-04-30T21:21:10.123456Z`'
        photo_date:
          type: string
          description: Date Group where this Photo is organized. In format `YYYY-MM-DD`
        photo_description:
          type:
          - string
          - 'null'
          description: 'Text displayed alongside the photo. Useful for communicating more

            context about what is in the photo or that the viewer would find informative.'
        photo:
          description: 'Details about a single Photo, such as URLs for displaying it

            at various sizes'
          $ref: '#/components/schemas/File'
      required:
      - uuid
      - order
      - created_at
      - photo_date
      - photo_description
      - photo
      title: 'Project Photo Log: Photo'
  securitySchemes:
    PublicApiBearerAuth:
      type: http
      description: 'Use the Public API key provided by FlipperForce as a Bearer token. Send the key exactly as provided in the Authorization header: `Authorization: Bearer <api-key>`.'
      scheme: bearer
      bearerFormat: FlipperForce Public API key
