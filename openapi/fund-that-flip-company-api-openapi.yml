    Company:
      type: object
      properties:
        uuid:
          type: string
          description: Public identifier.
        created_at:
          type: string
          description: 'Timestamp when Company was created in ISO 8601 Zulu format with microseconds.

            Example: `2025-04-30T21:21:10.123456Z`'
        updated_at:
          type: string
          description: 'Timestamp when Company was last changed in ISO 8601 Zulu format with microseconds.

