        is_1099_eligible:
          type:
          - boolean
          - 'null'
          description: Whether this Company is eligible to receive 1099 tax forms.
        workers_comp_insurance:
          type:
          - boolean
          - 'null'
          description: Whether this Company has Workers' Compensation insurance.
        workers_comp_insurance_expiration:
          type:
          - string
          - 'null'
          description: Workers' Compensation insurance expiration date in `YYYY-MM-DD` format.
        general_liability_insurance:
          type:
          - boolean
          - 'null'
          description: Whether this Company has General Liability insurance.
        general_liability_insurance_expiration:
          type:
          - string
          - 'null'
          description: General Liability insurance expiration date in `YYYY-MM-DD` format.
        category_uuids:
          type: array
          description: Company Category UUIDs assigned to this Company.
          items:
            type: string
