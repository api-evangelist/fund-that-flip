apis:
- aid: fund-that-flip:flipperforce-public-api
  name: FlipperForce Public API
  description: 'The FlipperForce Public API is the REST API behind Upright''s (formerly Fund That Flip''s)
    FlipperForce project management platform for real estate redevelopers. It exposes 50 operations across
    projects, expense transactions and line items, expense categories and accounts, project income, receipts,
    photo logs, project updates, companies and company categories, file upload intents, the user account
    and the workspace activity log. Access is by request only: a workspace owner requests a Public API
    key from Workspace Settings > Integrations, and the key is sent as an HTTP Bearer token.'
  humanURL: https://tools.flipperforce.com/docs/api
  baseURL: https://tools.flipperforce.com/api/v1
