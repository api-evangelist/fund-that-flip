aid: fund-that-flip
name: Fund That Flip
description: Fund That Flip is a Cleveland- and New York-based real estate fintech founded in 2014 that
  lends to residential redevelopers and offers passive income opportunities to accredited investors, having
  originated more than $2.6B in short-term hard money, fix-and-flip, new construction and DSCR loans.
  In 2022 it acquired FlipperForce, a web-based project management, deal analysis, rehab estimating and
  job-costing platform for house flippers and builders, and in September 2023 the combined lending and
  software business rebranded as Upright (upright.us). The company's developer surface is the FlipperForce
  Public API — an OpenAPI 3.1 documented REST API at tools.flipperforce.com/api/v1 covering projects,
  expenses, income, receipts, photo logs, project updates, companies, expense accounts and the workspace
  activity log.
